name: Build and Release macOS Universal

run-name: >-
  ${{
    startsWith(github.ref, 'refs/tags/v') && format('Release {0} — Build, Verify (arm64 + Intel) & Publish', github.ref_name) ||
    github.event_name == 'pull_request' && format('PR #{0} ({1}) — Build & Verify (arm64 + Intel)', github.event.pull_request.number, github.head_ref) ||
    github.event_name == 'workflow_dispatch' && format('Manual ({0}) — Build & Verify (arm64 + Intel)', github.ref_name) ||
    format('CI ({0}) — Build & Verify (arm64 + Intel)', github.ref_name)
  }}

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-universal:
    runs-on: macos-15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      zip_name: ${{ steps.package.outputs.zip_name }}
      dmg_name: ${{ steps.package.outputs.dmg_name }}
      artifact_name: LidStay-macOS-universal-${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Swift toolchain
        run: |
          uname -m
          sw_vers
          swift --version
          xcodebuild -version

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          else
            TAG="v$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
            VERSION="${TAG#v}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build Universal macOS app
        env:
          UNIVERSAL: "1"
          APP_OUT_DIR: "${{ github.workspace }}/dist"
          APP_VERSION: "${{ steps.version.outputs.version }}"
          BUILD_NUMBER: "${{ github.run_number }}"
        run: |
          ./build.sh
          ARCHS="$(lipo -archs dist/LidStay.app/Contents/MacOS/LidStay)"
          echo "Built architectures: ${ARCHS}"
          [[ "$ARCHS" == *"arm64"* && "$ARCHS" == *"x86_64"* ]]

      - name: Package zip and dmg
        id: package
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          ZIP_NAME="LidStay-${TAG}-macOS-universal.zip"
          DMG_NAME="LidStay-${TAG}-macOS-universal.dmg"
          DMG_STAGE="dist/dmg-stage"

          mkdir -p "$DMG_STAGE"
          cp -R dist/LidStay.app "$DMG_STAGE/LidStay.app"
          ln -s /Applications "$DMG_STAGE/Applications"

          ditto -c -k --keepParent dist/LidStay.app "dist/${ZIP_NAME}"
          hdiutil create -volname "LidStay" -srcfolder "$DMG_STAGE" -ov -format UDZO "dist/${DMG_NAME}"

          (cd dist && shasum -a 256 "${ZIP_NAME}" "${DMG_NAME}" > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

          echo "zip=dist/${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "dmg=dist/${DMG_NAME}" >> "$GITHUB_OUTPUT"
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "dmg_name=${DMG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Verify Apple Silicon (arm64) runtime
        run: |
          ./scripts/verify_runtime.sh \
            --arch arm64 \
            --expect-universal \
            --require-live-launch \
            --zip "${{ steps.package.outputs.zip }}" \
            --dmg "${{ steps.package.outputs.dmg }}"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LidStay-macOS-universal-${{ steps.version.outputs.tag }}
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.dmg }}
            dist/SHA256SUMS.txt

      - name: Write build summary
        run: |
          {
            echo "### Universal Build & Apple Silicon Verification"
            echo "- **Trigger:** \`${{ github.event_name }}\` on \`${{ github.ref_name }}\`"
            echo "- **Version:** \`${{ steps.version.outputs.tag }}\` (build \`${{ github.run_number }}\`)"
            echo "- **Architectures:** \`$(lipo -archs dist/LidStay.app/Contents/MacOS/LidStay)\`"
            echo "- **Apple Silicon (\`arm64\`) self-test & live launch:** passed"
            echo ""
            echo '```text'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  test-intel:
    name: Verify Intel (x86_64) Runtime
    needs: build-universal
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Intel runner environment
        run: |
          HOST_ARCH="$(uname -m)"
          echo "Runner architecture: ${HOST_ARCH}"
          [[ "$HOST_ARCH" == "x86_64" ]]
          sw_vers
          swift --version
          xcodebuild -version
          echo "=== IOPMrootDomain SleepDisabled ==="
          ioreg -rc IOPMrootDomain | grep -i SleepDisabled || true
          echo "=== pmset -g ==="
          pmset -g || true

      - name: Download Universal build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-universal.outputs.artifact_name }}
          path: dist

      - name: Verify Universal artifact checksums
        run: |
          (cd dist && shasum -a 256 -c SHA256SUMS.txt)

      - name: Verify Universal app natively on Intel (x86_64)
        run: |
          ./scripts/verify_runtime.sh \
            --arch x86_64 \
            --expect-universal \
            --require-live-launch \
            --zip "dist/${{ needs.build-universal.outputs.zip_name }}" \
            --dmg "dist/${{ needs.build-universal.outputs.dmg_name }}"

      - name: Verify native Intel build from source
        env:
          APP_OUT_DIR: "${{ github.workspace }}/dist-intel-native"
          APP_VERSION: "${{ needs.build-universal.outputs.version }}"
          BUILD_NUMBER: "${{ github.run_number }}"
        run: |
          ./build.sh
          ./scripts/verify_runtime.sh \
            --arch x86_64 \
            --require-live-launch \
            --app "dist-intel-native/LidStay.app"

      - name: Write Intel verification summary
        run: |
          {
            echo "### Intel (\`x86_64\`) Runtime Verification"
            echo "- **Runner:** \`$(uname -m)\` on macOS \`$(sw_vers -productVersion)\`"
            echo "- **Artifact checksums:** verified"
            echo "- **Universal \`.zip\` / \`.dmg\` native \`x86_64\` runtime:** passed"
            echo "- **Native Intel source build runtime:** passed"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Create GitHub Release
    needs:
      - build-universal
      - test-intel
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-universal.outputs.artifact_name }}
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ needs.build-universal.outputs.tag }}"
          gh release create "${TAG}" \
            "dist/${{ needs.build-universal.outputs.zip_name }}" \
            "dist/${{ needs.build-universal.outputs.dmg_name }}" \
            "dist/SHA256SUMS.txt" \
            --repo "${{ github.repository }}" \
            --title "LidStay ${TAG}" \
            --verify-tag \
            --generate-notes
          {
            echo "### GitHub Release Published"
            echo "- **Tag:** \`${TAG}\`"
            echo "- **URL:** https://github.com/${{ github.repository }}/releases/tag/${TAG}"
            echo "- **Assets:** \`${{ needs.build-universal.outputs.zip_name }}\`, \`${{ needs.build-universal.outputs.dmg_name }}\`, \`SHA256SUMS.txt\`"
          } >> "$GITHUB_STEP_SUMMARY"
